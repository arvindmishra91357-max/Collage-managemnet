databases:
  - name: mgi-postgres-db
    databaseName: mgi_portal
    user: mgi_user
    plan: free

services:
  - type: web
    name: mishra-group-institute-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mgi-postgres-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mishra-group-institute-portal.onrender.com
      - key: KEEP_ALIVE_URL
        value: https://mishra-group-institute-portal.onrender.com/api/health
      - key: KEEP_ALIVE_INTERVAL_MS
        value: 300000
