<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mishra Group Institute • B.Tech Cyber Security Student Portal (3CYBER7)</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MGI Portal">
  <meta name="description" content="Official Student Web App & PWA for Mishra Group Institute B.Tech Cyber Security (Division 3CYBER7, Academic Year 2026-27)">
  
  <!-- Favicon and Manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/style.css?v=2.0">
</head>
<body>
  <!-- App Root Mount Point -->
  <div id="app-root" class="app-container">
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;">
      <div style="width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:#38bdf8; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
      <p style="color:#94a3b8; font-size:13px; font-weight:600;">Loading Mishra Group Institute Cyber Portal...</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Application Logic Scripts (v2.0) -->
  <script src="/js/api.js?v=2.0"></script>
  <script src="/js/studentApp.js?v=2.0"></script>
  <script src="/js/adminApp.js?v=2.0"></script>
  <script src="/js/app.js?v=2.0"></script>
</body>
</html>
