[build]
  publish = "public"
  command = "npm run build"

# Direct APK downloads
[[redirects]]
  from = "/download/apk"
  to = "/apk/MGI_Student_Portal.apk"
  status = 302
  force = true

[[redirects]]
  from = "/apk/download"
  to = "/apk/MGI_Student_Portal.apk"
  status = 302
  force = true

[[redirects]]
  from = "/MGI_Student_Portal.apk"
  to = "/apk/MGI_Student_Portal.apk"
  status = 200

# Direct API and Uploads proxy to Render backend service
[[redirects]]
  from = "/api/*"
  to = "https://mishra-group-institute-portal.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://mishra-group-institute-portal.onrender.com/uploads/:splat"
  status = 200
  force = true

# Client-side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Strict Android APK package MIME type & headers
[[headers]]
  for = "/apk/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"MGI_Student_Portal.apk\""
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"MGI_Student_Portal.apk\""
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/download/apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"MGI_Student_Portal.apk\""
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/apk/download"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"MGI_Student_Portal.apk\""
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
